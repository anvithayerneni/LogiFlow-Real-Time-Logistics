apiVersion: v1
kind: ConfigMap
metadata:
  name: logiflow-config
  namespace: logiflow
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  API_V1_STR: "/api/v1"
  REDIS_URL: "redis://logiflow-redis:6379/0"
  REDIS_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "logiflow-kafka:9092"
  KAFKA_ENABLED: "true"
  KAFKA_CLIENT_ID: "logiflow-backend-k8s"
  DEFAULT_AVERAGE_SPEED_KMH: "30.0"
  DEFAULT_PREP_BUFFER_MINUTES: "5.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: logiflow-secrets
  namespace: logiflow
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres123@logiflow-postgres:5432/delivery_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres123"
  POSTGRES_DB: "delivery_db"
  SECRET_KEY: "supersecret-jwt-key-replace-in-production-min-32-chars-long"
