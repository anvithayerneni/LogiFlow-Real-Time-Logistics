apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logiflow-postgres
  namespace: logiflow
spec:
  serviceName: logiflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: logiflow-postgres
  template:
    metadata:
      labels:
        app: logiflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: POSTGRES_DB
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: logiflow-postgres
  namespace: logiflow
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: logiflow-postgres
