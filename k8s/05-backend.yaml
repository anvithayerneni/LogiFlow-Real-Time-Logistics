apiVersion: apps/v1
kind: Deployment
metadata:
  name: logiflow-backend
  namespace: logiflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logiflow-backend
  template:
    metadata:
      labels:
        app: logiflow-backend
    spec:
      containers:
        - name: backend
          image: logiflow/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: logiflow-config
            - secretRef:
                name: logiflow-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: logiflow-backend
  namespace: logiflow
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: logiflow-backend
