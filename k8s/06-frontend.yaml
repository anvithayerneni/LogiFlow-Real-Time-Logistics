apiVersion: apps/v1
kind: Deployment
metadata:
  name: logiflow-frontend
  namespace: logiflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logiflow-frontend
  template:
    metadata:
      labels:
        app: logiflow-frontend
    spec:
      containers:
        - name: frontend
          image: logiflow/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api.logiflow.local/api/v1"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://api.logiflow.local"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: logiflow-frontend
  namespace: logiflow
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: logiflow-frontend
