[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length
    "E712",  # SQLAlchemy comparison with True/False (e.g. Model.is_available == True)
    "F821",  # Forward references in SQLAlchemy type annotations
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
